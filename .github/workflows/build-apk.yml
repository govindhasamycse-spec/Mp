
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f UniversalMusicPlayer_GitHubBuild.zip

      - name: Extract Android project
        run: |
          unzip -q UniversalMusicPlayer_GitHubBuild.zip -d build-source
          ls -la build-source/UniversalMusicPlayer

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle -p build-source/UniversalMusicPlayer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalMusicPlayer-APK
          path: build-source/UniversalMusicPlayer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
